# PR 과 main push 마다 돈다. 설치 단계가 없다 — npm 의존성이 0개인 저장소다.
#
# job id 와 job name 은 ASCII 로 둔다. 브랜치 보호의 "필수 상태 검사" 가 이 이름을
# 글자까지 그대로 참조하므로, 한국어나 슬래시가 섞이면 이름을 고칠 때 보호 규칙이
# 영원히 통과하지 않는 상태로 PR 이 막힌다. 사람이 읽는 설명은 step name 에 둔다.
name: CI

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled 를 반드시 넣어야 한다. 기본 활성 종류는 opened·synchronize·reopened
    # 뿐이라서, rules-doc-exempt 라벨을 붙여도 **아무 것도 다시 돌지 않고** 실패한 필수 검사가
    # 그대로 남는다. 즉 문서가 안내하는 탈출구가 실제로는 닫혀 있다.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # core.quotepath 가 기본값(true)이면 git 이 한국어 경로를 8진수 이스케이프로
      # 출력해서(`"docs/\354\240\225..."`), 아래 grep 이 조용히 안 맞는다.
      # 그러면 검사가 깨지는 게 아니라 **항상 통과**한다. 이쪽이 더 위험하다.
      - name: UTF-8 로케일과 git 경로 출력 고정
        run: |
          echo "LANG=C.UTF-8"   >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
          git config core.quotepath false

      # 한국어 파일명이 체크아웃에서 깨졌으면 여기서 먼저, 분명하게 실패한다.
      # 아래 단계가 "파일 없음" 으로 애매하게 깨지는 걸 막는다.
      - name: 한국어 경로 확인
        run: |
          set -euo pipefail
          test -f "docs/정산-규칙.md" || {
            echo "::error file=docs/정산-규칙.md::한국어 파일명이 깨졌습니다. macOS 라면 git config --global core.precomposeunicode true 를 확인하십시오."
            exit 1
          }
          test -f src/index.html
          test -f tests/split.test.mjs
          test -f tools/build.mjs

      # 조각 규약: 껍데기 태그 없음, <title> 있음, <script> 문법 오류 없음,
      # 테마 분기가 :root 토큰 블록 밖으로 새지 않음.
      - name: 조각 검사
        run: node tools/build.mjs --check

      - name: 금액 계산 테스트
        run: node tests/split.test.mjs

      # pages.yml 은 main 에서만 돌기 때문에, 공개 배포본이 깨진 건 PR 에서 잡아야 한다.
      - name: 공개 배포본 생성 확인
        run: |
          set -euo pipefail
          node tools/build.mjs
          test -s dist/index.html
          head -c 300 dist/index.html | grep -qi '<!doctype html>'
          grep -qi '<meta charset="utf-8">' dist/index.html
          grep -qi 'name="viewport"' dist/index.html
          test -s dist/404.html

  rules-doc:
    name: rules-doc
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # 라벨을 API 로 다시 읽기 위해서다. 아래 주석 참고.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 금액 계산을 고쳤는데 기준 문서를 안 고친 PR 을 막는다.
      # 휴리스틱이다 — 단일 HTML 파일이라 "어느 파일이 바뀌었나" 로는 구분이 안 되므로
      # 패치 내용의 키워드로 추측한다. 과하게 잡히면 rules-doc-exempt 라벨로 빠져나간다.
      # 리뷰를 대체하는 장치가 아니라, 잊음을 줄이는 장치다. 라벨 남용은 리뷰에서 본다.
      - name: docs/정산-규칙.md 가 함께 고쳐졌는지 확인
        env:
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          git config core.quotepath false
          git fetch --no-tags origin "$BASE"
          RANGE="origin/$BASE...HEAD"

          # 아래가 전부 `grep -q <<< "$변수"` 인 이유: pipefail 과 `grep -q` 를
          # 파이프로 묶으면 grep 이 첫 일치에서 끝내 앞 명령이 SIGPIPE(141)로 죽고,
          # **일치했는데 파이프라인은 실패**로 읽힌다. 조용히 틀리는 쪽이라 더 나쁘다.
          # 그래서 먼저 변수에 담고, 파이프 없이 검사한다.

          # 라벨은 이벤트 페이로드가 아니라 API 로 **지금** 읽는다.
          # `gh run rerun` 은 원래 페이로드를 그대로 재생하므로, 검사가 실패한 뒤에 붙인
          # 라벨은 페이로드에 영원히 없다. 실제로 PR #3 이 그렇게 막혔다.
          LABELS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' || true)
          EXEMPT=no
          if grep -qx 'rules-doc-exempt' <<< "$LABELS"; then EXEMPT=yes; fi

          PATCH=$(git diff -U0 "$RANGE" -- src | grep -E '^[+-][^+-]' || true)

          MONEY=no
          # 강한 신호 — 금액 함수 자체이거나 그 입출력 이름이다. 걸러내지 않는다.
          if grep -qE '(function[[:space:]]+(compute|largestRemainder|sorted)|largestRemainder\(|receiptTotal|perHead)' <<< "$PATCH"; then
            MONEY=yes
          fi
          # 약한 신호 — 맨 Math.floor/round/ceil 은 픽셀 계산에도 쓰인다.
          # 화면 크기를 다루는 줄은 뺀다. 카메라 사진 축소 코드가 실제로 여기에 걸렸고,
          # 모든 UI PR 이 걸리는 검사는 라벨 남용을 가르칠 뿐 아무것도 막지 못한다.
          SOFT=$(grep -vE '(width|height|canvas|px|MAX_EDGE|scroll|client[XY]|devicePixel)' <<< "$PATCH" || true)
          if grep -qE 'Math\.(floor|round|ceil)' <<< "$SOFT"; then
            MONEY=yes
          fi

          NAMES=$(git diff --name-only "$RANGE")
          DOC=no
          if grep -qF 'docs/정산-규칙.md' <<< "$NAMES"; then DOC=yes; fi

          # 읽은 라벨 개수도 찍는다. 0 개면 "예외 라벨 없음" 과 "API 읽기 실패" 를
          # 구분할 수 없는데, 후자면 탈출구가 다시 조용히 닫힌 상태다.
          echo "금액 로직 변경: $MONEY / 규칙 문서 변경: $DOC / 예외 라벨: $EXEMPT (라벨 $(grep -c . <<< "$LABELS" || true)개 읽음)"

          if [ "$MONEY" = yes ] && [ "$DOC" = no ] && [ "$EXEMPT" != yes ]; then
            echo "::error::금액 계산을 고쳤는데 docs/정산-규칙.md 가 그대로입니다. 규칙 문서를 먼저 고치고 그 문장을 PR 본문에 인용하십시오. 계산 결과가 바뀌지 않는 리팩터링이라면 rules-doc-exempt 라벨을 붙이십시오."
            exit 1
          fi

          if [ "$DOC" = yes ] && ! grep -qF 'tests/split.test.mjs' <<< "$NAMES"; then
            echo "::warning file=tests/split.test.mjs::규칙 문서가 바뀌었는데 테스트가 그대로입니다. 바뀐 규칙을 고정하는 케이스를 추가했는지 확인하십시오."
          fi
