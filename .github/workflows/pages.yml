# main 에 머지되면 공개 주소를 갱신한다. 여기까지는 사람 손이 없다.
# Artifact 재배포는 자동화할 수 없다 — docs/배포.md 참고.
#
# Pages 소스는 반드시 "GitHub Actions" 로 둔다. 브랜치 모드로 두면 dist/ 를 커밋해야 하고,
# 그러면 1400줄 파일의 생성물까지 PR 마다 충돌한다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 막지만 진행 중인 배포를 취소하지는 않는다.
# 취소하면 Pages 가 반쯤 올라간 상태로 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # main 이 깨진 채로 공개 주소에 올라가는 것을 막는 마지막 관문.
      - name: 검사
        run: |
          node tools/build.mjs --check
          node tests/split.test.mjs

      # 조각(src/index.html) → 온전한 문서(dist/index.html).
      # doctype / charset / viewport / og / favicon 은 build.mjs 가 붙인다.
      - name: 빌드
        run: node tools/build.mjs

      - name: 배포본 검사
        run: |
          set -euo pipefail
          test -s dist/index.html
          head -c 300 dist/index.html | grep -qi '<!doctype html>'
          grep -qi '<meta charset="utf-8">' dist/index.html
          grep -qi 'name="viewport"' dist/index.html
          test -s dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  artifact-queue:
    name: artifact-queue
    needs: deploy
    if: vars.ARTIFACT_QUEUE_ISSUE != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Artifact 재배포는 소유자가 손으로 해야 한다 — 호출할 API 가 없다.
      # 자동화할 수 없으니, 대신 **잊히지 않게** 한다. 이 코멘트가
      # "Artifact 가 Pages 보다 얼마나 뒤처져 있는지" 의 유일한 기록이다.
      - name: 대기열 Issue 에 기록
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ vars.ARTIFACT_QUEUE_ISSUE }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          printf 'Pages 갱신됨 — [`%s`](%s)\n\n> %s\n\nArtifact 는 아직 이 커밋을 반영하지 않았습니다.\n' \
            "$SHORT" "$URL" "$(printf '%s' "$MSG" | head -1)" > body.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file body.md
